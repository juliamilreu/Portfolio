# Configuração do Pages CMS para o repositório juliamilreu/Portfolio
# Renomeie este arquivo para ".pages.yml" e coloque na RAIZ do repositório
# (mesmo nível da pasta "uploads", não dentro de "admin").

media:
  input: uploads
  output: /uploads

content:
  - name: portfolio
    label: "Portfólio"
    type: file
    path: "projects.json"
    format: json
    fields:
      - name: projects
        label: "Projetos"
        type: object
        list: true
        description: "Cada item é um projeto. Marque 'Destaque na home' para ele aparecer na página inicial."
        fields:
          - name: title
            label: "Título"
            type: string
            required: true
          - name: slug
            label: "Identificador (slug)"
            type: string
            required: true
            description: "Usado no link da página do projeto. Use letras minúsculas e hifens. Ex.: stop-word-duel"
          - name: vimeo
            label: "ID do vídeo no Vimeo"
            type: string
            required: true
            description: "Só o número. Ex.: em vimeo.com/719671885 o ID é 719671885"
          - name: previewFile
            label: "Vídeo de preview (upload, 2-3s)"
            type: file
            description: "Clipe curto (mp4/webm) só para o card. Recomendado: já cortado quadrado. Tem prioridade sobre os campos abaixo."
          - name: previewVimeo
            label: "Vídeo de preview (ID do Vimeo, alternativa)"
            type: string
            description: "Use outro vídeo do Vimeo só para o preview do card. Funciona melhor com vídeos 16:9."
          - name: previewStart
            label: "Início do preview (segundos)"
            type: number
            default: 0
            description: "Só vale para preview do Vimeo. Onde o loop começa. Use ponto para decimais (ex.: 3.2)."
            options:
              min: 0
          - name: category
            label: "Categoria"
            type: select
            required: true
            options:
              values: ["Motion", "Video Edition", "Graphic Design"]
          - name: featured
            label: "Destaque na home (featured)"
            type: boolean
            default: false
            description: "Ligado = aparece na página inicial (até 6). Sempre aparece na página WORK."
          - name: thumb
            label: "Capa (imagem estática)"
            type: image
            description: "Aparece fixa antes do vídeo/gif de preview do projeto começar a rodar. Deixe em branco para usar a capa automática do Vimeo."
          - name: blocks
            label: "Página do projeto (blocos)"
            type: block
            list: true
            blockKey: type
            description: "Monte a página do projeto na ordem que quiser."
            blocks:
              - name: header
                label: "Cabeçalho"
                fields:
                  - { name: title, label: "Título principal", type: string, required: true }
                  - { name: subtitle, label: "Subtítulo", type: string }
                  - { name: clientQuote, label: "Citação / about do cliente", type: text }
                  - { name: client, label: "Cliente", type: string }
              - name: heading
                label: "Título de seção"
                fields:
                  - { name: text, label: "Texto", type: string, required: true }
              - name: divider
                label: "Divisor (linha)"
                fields:
                  - name: width
                    label: "Largura"
                    type: select
                    default: "curta"
                    options:
                      values: ["curta", "total"]
              - name: text
                label: "Texto"
                fields:
                  - { name: body, label: "Conteúdo", type: rich-text, required: true }
              - name: text_media
                label: "Texto + mídia (lado a lado)"
                fields:
                  - { name: body, label: "Texto", type: rich-text, required: true }
                  - name: side
                    label: "Lado da mídia"
                    type: select
                    default: "direita"
                    options:
                      values: ["direita", "esquerda"]
                  - name: mediaType
                    label: "Tipo de mídia"
                    type: select
                    default: "video"
                    options:
                      values: ["video", "imagem"]
                  - { name: vimeo, label: "ID do vídeo (Vimeo)", type: string }
                  - { name: gif, label: "Vídeo mudo em loop (estilo gif)", type: boolean, default: true }
                  - name: orientation
                    label: "Orientação do vídeo"
                    type: select
                    default: "paisagem"
                    description: "Use 'Retrato' para vídeos verticais (ex.: preview de app/celular) para não ficarem espremidos."
                    options:
                      values:
                        - { name: paisagem, label: "Paisagem (16:9)" }
                        - { name: retrato, label: "Retrato / vertical (9:16)" }
                  - name: thumb
                    label: "Capa do vídeo (opcional)"
                    type: image
                    description: "Aparece antes de dar play. Deixe em branco para usar a capa automática do Vimeo."
                  - { name: image, label: "Imagem", type: image }
              - name: video
                label: "Vídeo (largura total)"
                fields:
                  - { name: vimeo, label: "ID do vídeo (Vimeo)", type: string, required: true }
                  - { name: gif, label: "Mudo em loop (estilo gif)", type: boolean, default: false }
                  - name: orientation
                    label: "Orientação do vídeo"
                    type: select
                    default: "paisagem"
                    description: "Use 'Retrato' para vídeos verticais (ex.: preview de app/celular) para não ficarem espremidos."
                    options:
                      values:
                        - { name: paisagem, label: "Paisagem (16:9)" }
                        - { name: retrato, label: "Retrato / vertical (9:16)" }
                  - name: thumb
                    label: "Capa do vídeo (opcional)"
                    type: image
                    description: "Aparece antes de dar play. Deixe em branco para usar a capa automática do Vimeo."
              - name: gallery
                label: "Galeria (vídeos/imagens lado a lado)"
                fields:
                  - name: columns
                    label: "Colunas"
                    type: number
                    default: 3
                    options:
                      min: 1
                      max: 4
                  - name: items
                    label: "Itens"
                    type: object
                    list: true
                    fields:
                      - { name: title, label: "Título (opcional)", type: string }
                      - name: mediaType
                        label: "Tipo"
                        type: select
                        default: "video"
                        options:
                          values: ["video", "imagem"]
                      - { name: vimeo, label: "ID do vídeo (Vimeo)", type: string }
                      - name: thumb
                        label: "Capa do vídeo (opcional)"
                        type: image
                        description: "Aparece fixa até o vídeo carregar. Só vale quando o Tipo é 'video'."
                      - { name: image, label: "Imagem / GIF", type: image }
              - name: image
                label: "Imagem"
                fields:
                  - { name: image, label: "Imagem", type: image, required: true }
                  - { name: full, label: "Largura total", type: boolean, default: false }

  - name: config
    label: "Configurações do site"
    type: file
    path: "site.json"
    format: json
    fields:
      - { name: name, label: "Nome", type: string, required: true }
      - name: logo
        label: "Logo (imagem do nome)"
        type: image
        description: "Suba o logo do seu nome (SVG ou PNG transparente). Vazio = usa o texto."
      - name: footerLogo
        label: "Logo do rodapé"
        type: image
        description: "Logo que aparece no rodapé, acima do e-mail. Use uma versão clara/branca. Vazio = usa o nome em texto."
      - { name: heroGreeting, label: "Saudação (ex.: HI!)", type: string, required: true }
      - { name: hero, label: "Texto de apresentação", type: text, required: true }
      - { name: heroEmphasis, label: "Frase em destaque", type: string, required: true }
      - name: reel
        label: "Vídeo Reel (ID do Vimeo)"
        type: string
        description: "ID do vídeo principal (motion reel) que aparece no topo da home."
      - name: reelCover
        label: "Capa do Reel (imagem)"
        type: image
        description: "Imagem de capa do reel. Vazio = usa a capa automática do Vimeo."
      - name: aboutPhoto
        label: "Foto da página About"
        type: image
        description: "Sua foto que aparece ao lado do texto na página About."
      - { name: about, label: "Sobre (página About)", type: text, required: true, description: "Separe os parágrafos com uma linha em branco." }
      - { name: email, label: "E-mail", type: string, required: true }
      - { name: linkedin, label: "LinkedIn", type: string }
      - { name: behance, label: "Behance", type: string }
      - { name: dribbble, label: "Dribbble", type: string }

  - name: codigo
    label: "Código do site (avançado)"
    type: group
    items:
      - name: script
        label: "script.js"
        type: file
        path: "script.js"
        format: code
      - name: styles
        label: "styles.css"
        type: file
        path: "styles.css"
        format: code
